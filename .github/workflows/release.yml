name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing numeric release tag missing its package asset
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open the release PR or create its draft Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Ensure the draft release tag exists
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          git fetch --tags --force

          if git rev-parse --verify --quiet "refs/tags/$TAG_NAME" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$TAG_NAME")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG_NAME exists at $tag_sha instead of $GITHUB_SHA"
              exit 1
            fi
          else
            git tag "$TAG_NAME" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG_NAME"
          fi

      - name: Run checks on the release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          pr_number="$(jq -r '.number // empty' <<< "$PR_JSON")"
          if [[ -z "$pr_number" ]]; then
            echo "Release Please did not return a pull request number; skipping dispatch."
            exit 0
          fi

          release_branch="$(gh pr view "$pr_number" --json headRefName --jq .headRefName)"
          gh workflow run test.yml --ref "$release_branch"

      - name: Resolve the release for packaging
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            if [[ ! "$REQUESTED_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::release_tag must be a numeric semver tag without a v prefix"
              exit 1
            fi
            tag="$REQUESTED_TAG"
            version="$REQUESTED_TAG"
          elif [[ "$RELEASE_CREATED" == "true" ]]; then
            tag="$RELEASE_TAG"
            version="$RELEASE_VERSION"
          else
            git fetch --tags --force
            tag="$(git tag --points-at "$GITHUB_SHA" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' | sort -V | tail -n 1)"
            version="$tag"
          fi

          if [[ -n "$tag" ]] && gh release view "$tag" >/dev/null 2>&1; then
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the released tag
        if: ${{ steps.package.outputs.release_ready == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.package.outputs.tag }}

      - name: Set up PHP
        if: ${{ steps.package.outputs.release_ready == 'true' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Set up Node
        if: ${{ steps.package.outputs.release_ready == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install package tooling
        if: ${{ steps.package.outputs.release_ready == 'true' }}
        run: npm ci

      - name: Build and verify the Plugin Package
        if: ${{ steps.package.outputs.release_ready == 'true' }}
        run: npm run test:package

      - name: Attach the Plugin Package
        if: ${{ steps.package.outputs.release_ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          asset_name="rfq-intake-$VERSION.zip"
          existing_asset="$(gh release view "$TAG_NAME" --json assets --jq \
            ".assets[] | select(.name == \"$asset_name\") | .name")"
          if [[ "$existing_asset" == "$asset_name" ]]; then
            echo "::error::$asset_name already exists; published Plugin Packages are immutable"
            exit 1
          fi

          gh release upload "$TAG_NAME" "dist/$asset_name"

      - name: Publish the immutable-ready Plugin Release
        if: ${{ steps.package.outputs.release_ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.package.outputs.tag }}
        run: gh release edit "$TAG_NAME" --draft=false
